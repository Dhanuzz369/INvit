<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two interlocked rings: rose gold and gold (palette rose #B76E79, gold #C9A66B) -->
  <defs>
    <clipPath id="over"><rect x="14" y="0" width="18" height="16"/></clipPath>
  </defs>
  <circle cx="11.5" cy="16" r="8" fill="none" stroke="#B76E79" stroke-width="3.2"/>
  <circle cx="20.5" cy="16" r="8" fill="none" stroke="#C9A66B" stroke-width="3.2"/>
  <!-- the rose ring passes over the gold one at the top crossing -->
  <circle cx="11.5" cy="16" r="8" fill="none" stroke="#B76E79" stroke-width="3.2" clip-path="url(#over)"/>
</svg>
